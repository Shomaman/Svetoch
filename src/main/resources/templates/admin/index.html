<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table>
    <tr th:each="theme: ${themes}">
        <td th:text="${theme.title}"></td>
        <td><form action="theme/edit" method="get">
            <input type="hidden" name="id" th:value="${theme.id}" />
            <input type="submit" value="Редактировать" />
        </form></td>
        <td><form action="theme/delete" method="post">
            <input type="hidden" name="id" th:value="${theme.id}" />
            <input type="submit" value="Удалить" />
        </form></td>
    </tr>
</table>
<a href="localhost:8080/admin/theme/create">Добавить новую тему</a>
</body>
</html>
